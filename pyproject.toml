[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2predict"
version = "0.9.6"
description = "Parametric price benchmarking for engineering and procurement trade-offs. Agentic first, runs on your data, stays on your machine."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-with-Internal-Use-Exception"
license-files = ["LICENSE"]
authors = [{name = "Ahmed Khalil Hafsi"}]
requires-python = ">=3.10,<3.15"
keywords = [
    "procurement",
    "price-prediction",
    "parametric-estimating",
    "should-cost",
    "shap",
    "conformal-prediction",
    "machine-learning",
    "scikit-learn",
    "xgboost",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "joblib>=1.2",
    "matplotlib>=3.9",
    "mpld3>=0.5",
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "rich>=13.3",
    "scikit-learn>=1.5",
    "scipy>=1.10",
    "seaborn>=0.12",
    "xgboost>=1.7",
    "halo>=0.0.31",
    "questionary>=1.10",
    "shap>=0.44,<0.53",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2",
]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/ahmed-khalil-hafsi/P2Predict"
Repository = "https://github.com/ahmed-khalil-hafsi/P2Predict"
Issues = "https://github.com/ahmed-khalil-hafsi/P2Predict/issues"
Changelog = "https://github.com/ahmed-khalil-hafsi/P2Predict/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/ahmed-khalil-hafsi/P2Predict/blob/main/ROADMAP.md"

[project.scripts]
p2predict = "p2predict.cli.predict:main"
p2predict-train = "p2predict.cli.train:train"
p2predict-mcp = "p2predict.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["p2predict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
