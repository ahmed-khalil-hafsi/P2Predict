# Reproduces the exact thing a Windows customer does: install the *published*
# package from PyPI into a fresh venv, across the Python versions people actually
# download, then prove it not only installs but RUNS (compiled deps like xgboost
# and shap can install fine yet fail at import time).
#
# The main CI (p2predict_train.yml) tests ubuntu + an editable local install,
# which never exercises this path. This is where "some customers can't install"
# lives.

name: Install smoke test (Windows)

on:
  workflow_dispatch: {}        # run on demand from the Actions tab
  release:
    types: [published]         # every release, before customers hit it
  schedule:
    - cron: "0 6 * * 1"        # weekly — catches upstream wheel breakage (e.g. a
                               # new Python that shap has no wheel for yet)

permissions:
  contents: read

jobs:
  windows-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false         # one Python version failing must not hide the others
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from PyPI exactly like a customer (fresh venv)
        run: |
          python -m venv "$HOME\P2Predict\venv"
          & "$HOME\P2Predict\venv\Scripts\pip.exe" install --upgrade pip
          & "$HOME\P2Predict\venv\Scripts\pip.exe" install "p2predict[mcp]"

      - name: Verify it RUNS, not just installs
        run: |
          & "$HOME\P2Predict\venv\Scripts\p2predict.exe" --version
          # Import the compiled deps — pip install can succeed while these fail
          # at import (missing VC++ runtime, wheel/ABI mismatch, source-build fell over).
          & "$HOME\P2Predict\venv\Scripts\python.exe" -c "import xgboost, shap, sklearn, scipy, pandas, numpy, matplotlib; print('imports OK')"
          # Console scripts must be wired, including the MCP entry point.
          & "$HOME\P2Predict\venv\Scripts\p2predict.exe" --help
          & "$HOME\P2Predict\venv\Scripts\p2predict-train.exe" --help
          & "$HOME\P2Predict\venv\Scripts\p2predict-mcp.exe" --help
