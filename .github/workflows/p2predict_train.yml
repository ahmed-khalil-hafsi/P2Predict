# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: P2Predict_train

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install P2Predict (and dev extras)
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Install the package via pyproject.toml — same path real users will
        # take (`pip install p2predict`), so CI validates the install surface
        # too, not just the code on disk.
        pip install -e ".[dev]"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests p2predict.py p2predict_train.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src tests p2predict.py p2predict_train.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run pytest
      run: |
        pytest tests/ -q --tb=short
    - name: Verify console scripts are wired
      run: |
        # If pyproject's [project.scripts] is misconfigured, --help would
        # fail with ModuleNotFoundError. This is the cheapest install-time
        # smoke check.
        p2predict --help > /dev/null
        p2predict-train --help > /dev/null

